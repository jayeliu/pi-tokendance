name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Required for npm trusted publishing (OIDC) and provenance attestation.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use npm >= 11.5.1 (required for trusted publishing)
        run: npm install --global "npm@^11"

      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          echo "tag=${GITHUB_REF_NAME} version=${version}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Test
        run: npm test

      # No NODE_AUTH_TOKEN: the npm CLI exchanges the GitHub OIDC token for a
      # short-lived publish token (trusted publishing). Provenance is generated
      # automatically for public packages from public repositories.
      - name: Publish
        run: npm publish --access public
